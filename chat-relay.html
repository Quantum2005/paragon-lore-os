<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Chat Service</title>
  <link rel="stylesheet" href="./assets/chat-relay.css" />
</head>
<body>
  <div class="crt" aria-label="Relay chat interface">
    <div class="noise" aria-hidden="true"></div>
    <main class="screen">
      <header class="topbar">
        <div id="channelLabel">INTERCHAT RELAY NETWORK // CHANNEL #LOBBY</div>
        <div id="currentTime" aria-live="off"></div>
        <div id="whoami"></div>
        <button id="modToggle" class="mod-toggle" type="button" hidden>MOD</button>
      </header>

      <section id="tableWrap" class="table-wrap">
        <table class="chat-table" id="chatTable">
          <thead>
            <tr>
              <th class="meta-col">USERNAME</th>
              <th class="meta-col">TIME</th>
              <th>CHAT</th>
            </tr>
          </thead>
          <tbody id="chatBody"></tbody>
        </table>
      </section>

      <form id="composer" class="composer" aria-label="Relay command input">
        <span id="composerPath" class="composer-path">ARS40://USER</span>
        <span class="prompt">&gt;</span>
        <input id="messageInput" class="composer-input" type="text" maxlength="600" autocomplete="off" spellcheck="false" value="/send " aria-label="Chat command input" />
      </form>

      <div id="status" class="status" aria-live="polite"></div>
      <div id="toast" class="toast" hidden></div>
    </main>

    <div id="modMenu" class="mod-menu" hidden>
      <div class="mod-title">MODERATION PANEL</div>
      <dl class="mod-stats">
        <div><dt>CHANNEL</dt><dd id="modChannel">-</dd></div>
        <div><dt>MESSAGES</dt><dd id="modMessageCount">0</dd></div>
        <div><dt>MEMBERS</dt><dd id="modMemberCount">0</dd></div>
      </dl>
      <div class="mod-selection">SELECTED MESSAGE</div>
      <div class="mod-item">Message ID: <span id="modMessageId">Select a message</span></div>
      <div class="mod-item">User: <span id="modUserId">-</span></div>
      <button data-action="delete" disabled>Delete Message</button>
      <button data-action="kick" disabled>Kick User</button>
      <button data-action="ban" disabled>Ban User</button>
      <button data-action="close">Close Panel</button>
    </div>
  </div>

  <script src="./assets/chat-relay.js"></script>
</body>
</html>
